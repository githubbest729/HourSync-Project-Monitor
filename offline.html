<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline — HourSync</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark light}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0;font:16px/1.5 system-ui,sans-serif;padding:20px}
.c{max-width:440px;border:1px solid #334155;border-top:4px solid #f59e0b;background:#1e293b;border-radius:14px;padding:24px;text-align:center}
img{width:72px;height:72px;border-radius:16px}
h1{margin:10px 0 4px;font-size:1.3rem}p{color:#94a3b8;margin:6px 0}
button{margin:6px;padding:10px 18px;border-radius:8px;border:1px solid #06b6d4;background:#06b6d4;color:#041018;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
button.s{background:transparent;color:#06b6d4}
#st{font-family:ui-monospace,monospace;font-size:.85rem;color:#f59e0b}
@media (prefers-color-scheme:light){body{background:#f1f5f9;color:#0f172a}.c{background:#fff;border-color:#cbd5e1}p{color:#475569}}
</style>
</head>
<body>
<div class="c">
  <img src="icons/icon-192.png" alt="HourSync">
  <h1>You're offline</h1>
  <p>The requested page isn't cached. Your HourSync data lives on this device and is safe.</p>
  <p id="st">Checking…</p>
  <button onclick="location.href='index.html'">Open HourSync</button>
  <button class="s" onclick="location.reload()">Retry connection</button>
</div>
<script>
(async()=>{
  const el=document.getElementById('st');
  const on=navigator.onLine;
  let cached='unknown';
  try{const ks=await caches.keys();cached=ks.length?ks.filter(k=>k.startsWith('hoursync-')).length+' cache set(s) available':'no cache yet';}catch(e){}
  el.textContent=(on?'● Network reachable':'● No network')+' · '+cached;
  addEventListener('online',()=>location.href='index.html');
})();
</script>
</body>
</html>
